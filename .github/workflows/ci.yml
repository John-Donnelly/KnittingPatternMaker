name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Validate the Cloudflare Worker bundles (it packages apps/web/dist, so it runs after the
      # main build). --dry-run needs no Cloudflare credentials.
      - run: npm run build --workspace=apps/worker
      - run: npm test
