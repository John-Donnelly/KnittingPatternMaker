<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knitting Pattern Maker — turn any picture into a pattern</title>
    <meta
      name="description"
      content="Turn any photo, drawing, or pixel art into a complete knitting chart with row-by-row instructions, yardage estimates, and seamless repeats — right in your browser."
    />
    <meta name="theme-color" content="#a85535" />
    <!-- Social link previews. og:image and og:url need the production domain, so they are added
         at deploy time rather than hardcoded to a guessed URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Knitting Pattern Maker — turn any picture into a pattern" />
    <meta
      property="og:description"
      content="Turn any photo, drawing, or pixel art into a complete knitting chart with row-by-row instructions, yardage estimates, and seamless repeats."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Knitting Pattern Maker" />
    <meta
      name="twitter:description"
      content="Turn any photo, drawing, or pixel art into a complete knitting chart — right in your browser."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧶</text></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
